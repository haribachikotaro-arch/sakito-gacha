<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#efede5">
  <title>SAKITO ガチャ</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23265e48'/%3E%3Ctext x='32' y='45' text-anchor='middle' font-family='Georgia' font-size='40' fill='%23fff7de'%3ES%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script src="capsule.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body data-phase="idle">
  <header class="header">
    <a class="wordmark" href="./" aria-label="SAKITO ガチャ">SAKITO<span>ガチャ</span></a>
    <div class="header-tools">
      <p class="balance" aria-label="所持ポイント"><strong id="pointsValue">120</strong><span>pt</span></p>
      <button class="icon-button" id="settingsButton" type="button" aria-label="設定" aria-controls="settingsPanel" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 7h16M4 17h16" stroke="currentColor" stroke-width="1.5"/><circle cx="9" cy="7" r="3" fill="var(--paper)" stroke="currentColor" stroke-width="1.5"/><circle cx="15" cy="17" r="3" fill="var(--paper)" stroke="currentColor" stroke-width="1.5"/></svg>
      </button>
    </div>
    <section class="settings-panel" id="settingsPanel" aria-label="設定" hidden>
      <label><span>効果音</span><input type="checkbox" id="soundToggle" role="switch"></label>
      <label><span>音量</span><input type="range" id="volume" min="0" max="100" value="40" aria-label="音量"></label>
      <button type="button" id="collectionButton">獲得した引換券 <span id="collectionCount">0</span></button>
      <div class="debug-controls" id="debugPanel" hidden>
        <label>抽選結果<select id="demoMode"><option value="random">ランダム</option><option value="gold">当たり</option><option value="normal">通常</option><option value="none">参加賞</option><option value="error">通信エラー</option></select></label>
        <button type="button" id="resetButton">データをリセット</button>
      </div>
    </section>
  </header>

  <main class="playground" aria-label="引換券ガチャ">
    <div class="scene" id="scene">
      <div class="ground" aria-hidden="true"></div>
      <div class="machine" id="machine" aria-label="角型ケースのガチャ本体">
        <div class="case-roof" aria-hidden="true"><span class="roof-name">SAKITO</span></div>
        <div class="glass-case" id="glassCase">
          <canvas id="capsuleCanvas" aria-label="ケースの底に積み重なったカプセル"></canvas>
          <div class="glass-shine" aria-hidden="true"></div>
          <div class="glass-foot" aria-hidden="true"></div>
        </div>
        <div class="case-collar" aria-hidden="true"></div>
        <div class="cabinet">
          <div class="cabinet-top" aria-hidden="true"></div>
          <i class="screw screw-left" aria-hidden="true"></i><i class="screw screw-right" aria-hidden="true"></i>
          <button type="button" class="coin-slot" id="coinSlot" aria-label="レバー上のコイン投入口。キーボードではEnterでコインを投げる">
            <span class="slot-slit" aria-hidden="true"></span>
          </button>
          <div class="handle-mount">
            <svg class="turn-guide" viewBox="0 0 140 140" aria-hidden="true">
              <circle class="turn-track" cx="70" cy="70" r="65"/>
              <circle class="turn-progress" id="turnProgress" cx="70" cy="70" r="65" pathLength="1"/>
            </svg>
            <button type="button" class="handle" id="handle" aria-label="中央のレバー。右に1回転。Enterでも回せます" disabled>
              <span class="handle-dial" aria-hidden="true"><span class="handle-grip"></span><span class="handle-pin"></span></span>
            </button>
            <svg class="crank-arrow" viewBox="0 0 200 200" aria-hidden="true">
              <circle class="crank-hit-area" cx="100" cy="100" r="98"/>
              <path class="crank-arrow-outline" d="M25 141 A85 85 0 0 1 175 61"/>
              <path class="crank-arrow-color" d="M25 141 A85 85 0 0 1 175 61"/>
              <path class="crank-arrow-head" d="M161 57 L190 81 L193 41 Z"/>
            </svg>
          </div>
          <div class="outlet-frame" aria-hidden="true">
            <div class="outlet" id="outlet"><span class="outlet-flap" id="outletFlap"></span></div>
            <div class="outlet-tray"></div>
          </div>
          <div class="cabinet-foot" aria-hidden="true"></div>
        </div>
        <div class="machine-plinth" aria-hidden="true"></div>
      </div>
    </div>
    <div class="play-controls">
      <p class="status" id="statusText" role="status" aria-live="polite"> </p>
      <button class="coin-action" id="coinButton" type="button"><span class="small-coin" aria-hidden="true">S</span><span id="coinButtonLabel">コインを使う</span><span class="button-cost">10 pt</span></button>
      <button class="cancel-action" id="cancelCoinButton" type="button" hidden>やめる</button>
    </div>
  </main>

  <div class="coin-spotlight" id="coinSpotlight" aria-hidden="true"></div>
  <div class="coin-energy" id="coinEnergy" aria-hidden="true" hidden></div>
  <div class="coin-stage" id="coinStage">
  <button class="coin-token" id="coinToken" type="button" aria-label="コイン。下へ引っ張り、はなせの表示が出たら指を離す。Enterでも投げられます" hidden>
    <span class="coin-shell coin-ghost" aria-hidden="true"><span class="coin-face"><span class="coin-letter">S</span><span class="coin-rim-label">SAKITO</span></span></span>
    <span class="coin-shell coin-gold" id="coinGold" aria-hidden="true"><span class="coin-face"><span class="coin-letter">S</span><span class="coin-rim-label">SAKITO</span></span></span>
    <span class="coin-solid" id="coinSolid" aria-hidden="true">
      <span class="coin-shell coin-front"><span class="coin-face"><span class="coin-letter">S</span><span class="coin-rim-label">SAKITO</span></span></span>
      <span class="coin-shell coin-back"><span class="coin-face"><span class="coin-letter">S</span><span class="coin-rim-label">SAKITO</span></span></span>
      <span class="coin-edge" id="coinEdge"></span>
    </span>
  </button>
  </div>
  <div class="coin-gesture" id="coinGesture" aria-hidden="true" hidden>
    <svg class="pull-arrow" id="pullArrow" viewBox="0 0 64 120"><path class="pull-arrow-shape" id="pullArrowShape" d="M22 3 H42 V87 H60 L32 117 L4 87 H22 Z"/></svg>
    <span id="gestureLabel">下に引っ張れ！</span>
  </div>

  <div class="reveal-layer" id="revealLayer" aria-hidden="true" hidden>
    <div class="reveal-glow" aria-hidden="true"></div><div class="reveal-rays" aria-hidden="true"></div>
    <div class="hero-capsule" id="heroCapsule" aria-hidden="true">
      <span class="shell shell-top"></span><span class="shell shell-bottom"></span>
      <div class="revealed-ticket" id="revealedTicket"><span id="revealName"></span></div>
    </div>
    <p class="reveal-word" id="revealWord" aria-hidden="true"></p>
    <button class="skip-action" id="skipButton" type="button">スキップ</button>
  </div>

  <dialog class="result-dialog" id="resultDialog" aria-labelledby="resultTitle">
    <button class="dialog-close" id="closeResultButton" aria-label="結果を閉じる" type="button">×</button>
    <div class="result-ticket" id="resultTicket">
      <p class="ticket-kind" id="resultKind">引換券</p>
      <h1 id="resultTitle"></h1>
      <p class="ticket-store" id="resultStore"></p>
      <p class="ticket-expiry" id="resultExpiry"></p>
    </div>
    <div class="result-actions"><button type="button" class="main-action" id="againButton">もう一回 <span>10 pt</span></button></div>
  </dialog>

  <dialog class="collection-dialog" id="collectionDialog" aria-labelledby="collectionTitle">
    <button class="dialog-close" id="closeCollectionButton" type="button" aria-label="一覧を閉じる">×</button>
    <h2 id="collectionTitle">獲得した引換券</h2>
    <div id="collectionList"></div>
  </dialog>
  <p class="toast" id="toast" role="status" hidden></p>
  <div class="sr-only" id="liveRegion" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
